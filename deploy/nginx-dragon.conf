# Dragon Craft: a static site, nginx serves /var/www/dragon directly (no app process).
# This is the version BEFORE certbot adds the 443 block and the HTTP->HTTPS redirect.
server {
    server_name dragon.gordhamer.com;

    root /var/www/dragon;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Only the game's own files are public; everything else (including dotfiles) is a 404.
    location = / { add_header Cache-Control "no-cache"; try_files /index.html =404; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /style.css { add_header Cache-Control "no-cache"; }
    location /src/ { add_header Cache-Control "no-cache"; try_files $uri =404; }
    # Three.js is pinned (r186), safe to cache for a week.
    location /vendor/ { add_header Cache-Control "public, max-age=604800"; try_files $uri =404; }
    location / { return 404; }
}
